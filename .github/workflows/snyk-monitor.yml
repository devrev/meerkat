name: Monitor dependencies with Snyk

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snyk-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Upload Snyk snapshot
        run: >-
          npx --yes snyk@1.1307.2 monitor --dev
          --org=devrev --policy-path=.snyk
          --project-name=@meerkat/source
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Test dependencies
        run: >-
          npx --yes snyk@1.1307.2 test --dev
          --org=devrev --policy-path=.snyk
          --severity-threshold=low
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
